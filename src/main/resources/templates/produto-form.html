<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Cadastro de produtos da Cafeteria Segura">

    <meta name="author"
          content="Lucas Segura">

    <title>Novo Produto | Cafeteria Segura</title>


    <!-- Bootstrap -->

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet">


    <!-- CSS -->

    <link
            rel="stylesheet"
            th:href="@{/css/style.css}">


    <style>

        body {
            min-height: 100vh;
            background: #080808;
            color: #ffffff;
        }

        .produto-form-container {
            max-width: 800px;
            margin: 60px auto;
        }

        .produto-form-card {
            background: #161616;
            border: 1px solid #333;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }

        .produto-form-title {
            color: #d4af37;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .produto-form-subtitle {
            color: #aaa;
            margin-bottom: 30px;
        }

        .form-label {
            color: #ddd;
            font-weight: 600;
        }

        .form-control,
        .form-select {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            border-radius: 10px;
            padding: 12px;
        }

        .form-control:focus,
        .form-select:focus {
            background: #222;
            color: #fff;
            border-color: #d4af37;
            box-shadow: 0 0 0 0.2rem rgba(212, 175, 55, 0.15);
        }

        .form-control::placeholder {
            color: #777;
        }

        .imagem-area {
            border: 2px dashed #555;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            margin-top: 10px;
            transition: 0.3s;
        }

        .imagem-area:hover {
            border-color: #d4af37;
        }

        .imagem-icone {
            font-size: 45px;
            margin-bottom: 10px;
        }

        .imagem-texto {
            color: #aaa;
            margin-bottom: 15px;
        }

        .btn-salvar {
            background: #d4af37;
            color: #111;
            border: none;
            font-weight: 700;
            padding: 12px 25px;
            border-radius: 10px;
        }

        .btn-salvar:hover {
            background: #f0d56a;
            color: #111;
        }

        .btn-voltar {
            background: transparent;
            color: #ccc;
            border: 1px solid #555;
            padding: 12px 25px;
            border-radius: 10px;
            text-decoration: none;
        }

        .btn-voltar:hover {
            color: #fff;
            border-color: #888;
        }

    </style>

</head>


<body>


<!-- HEADER -->

<header class="site-header">

    <nav class="navbar navbar-expand-lg navbar-dark">

        <div class="container">

            <a
                    class="navbar-brand"
                    th:href="@{/}">

                ☕ Cafeteria Segura

            </a>


            <a
                    class="btn btn-outline-light"
                    th:href="@{/produtos}">

                Voltar aos produtos

            </a>

        </div>

    </nav>

</header>


<!-- FORMULÁRIO -->

<main class="container">

    <div class="produto-form-container">

        <div class="produto-form-card">


            <!-- TÍTULO -->

            <h1 class="produto-form-title">

                Cadastrar produto

            </h1>


            <p class="produto-form-subtitle">

                Preencha os dados e escolha a imagem
                do produto no seu computador.

            </p>


            <!-- FORM -->

            <form
                    th:action="@{/produtos/salvar}"
                    th:object="${produto}"
                    method="post"
                    enctype="multipart/form-data">


                <!-- NOME -->

                <div class="mb-4">

                    <label
                            for="nome"
                            class="form-label">

                        Nome do produto

                    </label>

                    <input
                            type="text"
                            id="nome"
                            th:field="*{nome}"
                            class="form-control"
                            placeholder="Ex.: Café Espresso"
                            required>

                </div>


                <!-- DESCRIÇÃO -->

                <div class="mb-4">

                    <label
                            for="descricao"
                            class="form-label">

                        Descrição

                    </label>

                    <textarea
                            id="descricao"
                            th:field="*{descricao}"
                            class="form-control"
                            rows="4"
                            maxlength="500"
                            placeholder="Descreva o produto..."
                            required></textarea>

                </div>


                <!-- PREÇO -->

                <div class="mb-4">

                    <label
                            for="preco"
                            class="form-label">

                        Preço

                    </label>

                    <input
                            type="number"
                            id="preco"
                            th:field="*{preco}"
                            class="form-control"
                            step="0.01"
                            min="0"
                            placeholder="0,00"
                            required>

                </div>


                <!-- CATEGORIA -->

                <div class="mb-4">

                    <label
                            for="categoria"
                            class="form-label">

                        Categoria

                    </label>

                    <select
                            id="categoria"
                            th:field="*{categoria}"
                            class="form-select"
                            required>

                        <option value="">
                            Selecione uma categoria
                        </option>

                        <option value="BEBIDAS_QUENTES">
                            Bebidas quentes
                        </option>

                        <option value="BEBIDAS_GELADAS">
                            Bebidas geladas
                        </option>

                        <option value="PADARIA_CONFEITARIA">
                            Padaria e confeitaria
                        </option>

                        <option value="LANCHES_SALGADOS">
                            Lanches salgados
                        </option>

                        <option value="SOBREMESAS">
                            Sobremesas
                        </option>

                        <option value="OPCOES_SAUDAVEIS">
                            Opções saudáveis
                        </option>

                        <option value="PRODUTOS_VENDA">
                            Produtos para venda
                        </option>

                    </select>

                </div>


                <!-- IMAGEM -->

                <div class="mb-4">

                    <label
                            for="imagemArquivo"
                            class="form-label">

                        Imagem do produto

                    </label>


                    <div class="imagem-area">

                        <div class="imagem-icone">
                            🖼️
                        </div>

                        <p class="imagem-texto">

                            Escolha uma imagem do seu computador.

                        </p>

                        <input
                                type="file"
                                id="imagemArquivo"
                                name="imagemArquivo"
                                class="form-control"
                                accept="image/*"
                                required>

                    </div>

                </div>


                <!-- BOTÕES -->

                <div
                        class="d-flex gap-3 justify-content-end mt-4">

                    <a
                            class="btn-voltar"
                            th:href="@{/produtos}">

                        Cancelar

                    </a>


                    <button
                            type="submit"
                            class="btn-salvar">

                        💾 Salvar produto

                    </button>

                </div>

            </form>

        </div>

    </div>

</main>


<!-- BOOTSTRAP JS -->

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
