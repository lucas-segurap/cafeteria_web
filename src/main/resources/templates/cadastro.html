<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Crie sua conta na Cafeteria Segura">

    <meta name="author"
          content="Lucas Segura">

    <title>Cadastro | Cafeteria Segura</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

    
</head>

<body>

<header>
    <nav>
        <a th:href="@{/}">
            Cafeteria Segura
        </a>

        <a th:href="@{/}">
            Início
        </a>

        <a th:href="@{/produtos}">
            Produtos
        </a>

        <a th:href="@{/login}">
            Login
        </a>
    </nav>
</header>

<main class="cadastro-container">

    <section class="cadastro-card">

        <h1>Criar conta</h1>

        <p class="cadastro-subtitulo">
            Cadastre-se para realizar seus pedidos.
        </p>

        <!-- Mensagem de erro -->
        <div
            class="mensagem-erro"
            th:if="${erro}"
            th:text="${erro}">
            Este e-mail já está cadastrado.
        </div>

        <form
            th:action="@{/cadastro}"
            method="post">

            <div class="campo-cadastro">

                <label for="nome">
                    Nome completo
                </label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome"
                    autocomplete="name"
                    required>

            </div>

            <div class="campo-cadastro">

                <label for="telefone">
                    Telefone
                </label>

                <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    placeholder="(00) 00000-0000"
                    autocomplete="tel"
                    required>

            </div>

            <div class="campo-cadastro">

                <label for="endereco">
                    Endereço
                </label>

                <textarea
                    id="endereco"
                    name="endereco"
                    placeholder="Digite seu endereço"
                    autocomplete="street-address"
                    required></textarea>

            </div>

            <div class="campo-cadastro">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    autocomplete="email"
                    required>

            </div>

            <div class="campo-cadastro">

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Crie uma senha"
                    autocomplete="new-password"
                    minlength="6"
                    required>

            </div>

            <button
                type="submit"
                class="btn-cadastro">
                Criar minha conta
            </button>

        </form>

        <div class="login-link">

            <p>
                Já possui uma conta?
            </p>

            <a th:href="@{/login}">
                Entrar na minha conta
            </a>

        </div>

    </section>

</main>

<footer>
    <p>
        &copy; 2026 Cafeteria Segura. Todos os direitos reservados.
    </p>
</footer>

</body>
</html>
