<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Meus Agendamentos | Cafeteria Segura</title>

    <link rel="stylesheet"
          th:href="@{/css/agendamentos.css}">

</head>

<body>

<main class="agendamento-page">

    <section class="agendamento-container">

        <header class="agendamento-header">

            <div>

                <span>CAFETERIA SEGURA</span>

                <h1>Meus agendamentos</h1>

                <p>
                    Olá,
                    <strong th:text="${cliente.nome}">
                        Cliente
                    </strong>.
                </p>

            </div>

            <a th:href="@{/agendamentos/novo}"
               class="btn-novo">
                + Novo agendamento
            </a>

        </header>


        <div th:if="${agendamentos == null || agendamentos.isEmpty()}"
             class="vazio">

            <div>📅</div>

            <h2>Nenhum agendamento</h2>

            <p>
                Você ainda não possui agendamentos.
            </p>

            <a th:href="@{/agendamentos/novo}"
               class="btn-novo">
                Fazer agendamento
            </a>

        </div>


        <section th:unless="${agendamentos == null || agendamentos.isEmpty()}"
                 class="lista-agendamentos">

            <article class="agendamento-card"
                     th:each="agendamento : ${agendamentos}">

                <div class="card-topo">

                    <div>

                        <small>AGENDAMENTO</small>

                        <h2>
                            #
                            <span th:text="${agendamento.id}">
                                1
                            </span>
                        </h2>

                    </div>

                    <span class="status"
                          th:text="${agendamento.status}">
                        PENDENTE
                    </span>

                </div>


                <div class="dados-agendamento">

                    <div>
                        <small>Data</small>

                        <strong th:text="${agendamento.data}">
                            08/10/2026
                        </strong>
                    </div>

                    <div>
                        <small>Horário</small>

                        <strong th:text="${agendamento.horario}">
                            15:00
                        </strong>
                    </div>

                    <div>
                        <small>Pessoas</small>

                        <strong th:text="${agendamento.pessoas}">
                            2
                        </strong>
                    </div>

                </div>


                <div th:if="${agendamento.observacao != null &&
                             !agendamento.observacao.isEmpty()}"
                     class="observacao">

                    <small>Observação</small>

                    <p th:text="${agendamento.observacao}">
                    </p>

                </div>


                <a th:if="${agendamento.status.name() == 'PENDENTE' ||
                            agendamento.status.name() == 'CONFIRMADO'}"
                   th:href="@{/agendamentos/cancelar/{id}(id=${agendamento.id})}"
                   class="btn-cancelar"
                   onclick="return confirm('Deseja cancelar este agendamento?');">

                    Cancelar agendamento

                </a>

            </article>

        </section>

    </section>

</main>

</body>
</html>
