<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Cadastro de funcionário da Cafeteria Segura">

    <meta name="author"
          content="Lucas Segura">

    <title>Cadastro de Funcionário | Cafeteria Segura</title>

    <link rel="stylesheet"
          th:href="@{/css/login.css}">

    <style>

        .cadastro-card {
            width: 100%;
            max-width: 650px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .campo-completo {
            grid-column: 1 / -1;
        }

        .campo-login input,
        .campo-login select {
            width: 100%;
        }

        .mensagem-erro {
            margin-bottom: 20px;
        }

        @media (max-width: 650px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .campo-completo {
                grid-column: auto;
            }

        }

    </style>

</head>


<body>


<!-- =========================================================
     CABEÇALHO
========================================================= -->

<header class="site-header">

    <nav class="navbar">

        <div class="container">

            <a class="navbar-brand"
               th:href="@{/}">

                <span class="navbar-brand-mark">
                    ☕
                </span>

                Cafeteria Segura

            </a>

            <div class="menu">

                <a class="nav-link"
                   th:href="@{/}">
                    Home
                </a>

                <a class="nav-link"
                   th:href="@{/produtos}">
                    Produtos
                </a>

                <a class="nav-link"
                   th:href="@{/funcionarios/login}">
                    Login funcionário
                </a>

            </div>

        </div>

    </nav>

</header>


<!-- =========================================================
     CADASTRO
========================================================= -->

<main class="login-container">

    <section class="login-card cadastro-card">


        <!-- ÍCONE -->

        <div class="login-icon">
            👨‍💼
        </div>


        <!-- TÍTULO -->

        <h1>
            Cadastro de Funcionário
        </h1>

        <p class="login-subtitulo">
            Preencha os dados para cadastrar um funcionário.
        </p>


        <!-- MENSAGEM DE ERRO -->

        <div class="mensagem-erro"
             th:if="${erro}"
             th:text="${erro}">

            Ocorreu um erro no cadastro.

        </div>


        <!-- =================================================
             FORMULÁRIO
        ================================================== -->

        <form th:action="@{/funcionarios/cadastro}"
              method="post">


            <div class="form-grid">


                <!-- NOME -->

                <div class="campo-login campo-completo">

                    <label for="nome">
                        Nome completo
                    </label>

                    <input
                            type="text"
                            id="nome"
                            name="nome"
                            placeholder="Digite o nome completo"
                            autocomplete="name"
                            required>

                </div>


                <!-- CPF -->

                <div class="campo-login">

                    <label for="cpf">
                        CPF
                    </label>

                    <input
                            type="text"
                            id="cpf"
                            name="cpf"
                            placeholder="000.000.000-00"
                            maxlength="14"
                            required>

                </div>


                <!-- TELEFONE -->

                <div class="campo-login">

                    <label for="telefone">
                        Telefone
                    </label>

                    <input
                            type="tel"
                            id="telefone"
                            name="telefone"
                            placeholder="(11) 99999-9999"
                            maxlength="15"
                            autocomplete="tel"
                            required>

                </div>


                <!-- E-MAIL -->

                <div class="campo-login campo-completo">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="funcionario@email.com"
                            autocomplete="email"
                            required>

                </div>


                <!-- CARGO -->

                <div class="campo-login">

                    <label for="cargo">
                        Cargo
                    </label>

                    <select
                            id="cargo"
                            name="cargo"
                            required>

                        <option value="">
                            Selecione o cargo
                        </option>

                        <option value="Gerente">
                            Gerente
                        </option>

                        <option value="Atendente">
                            Atendente
                        </option>

                        <option value="Caixa">
                            Caixa
                        </option>

                        <option value="Barista">
                            Barista
                        </option>

                        <option value="Cozinheiro">
                            Cozinheiro
                        </option>

                        <option value="Auxiliar">
                            Auxiliar
                        </option>

                    </select>

                </div>


                <!-- SALÁRIO -->

                <div class="campo-login">

                    <label for="salario">
                        Salário
                    </label>

                    <input
                            type="number"
                            id="salario"
                            name="salario"
                            placeholder="0,00"
                            min="0"
                            step="0.01"
                            required>

                </div>


                <!-- SENHA -->

                <div class="campo-login campo-completo">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Digite uma senha"
                            autocomplete="new-password"
                            minlength="6"
                            required>

                    <small>
                        A senha deve possuir pelo menos 6 caracteres.
                    </small>

                </div>


                <!-- BOTÃO -->

                <div class="campo-completo">

                    <button
                            type="submit"
                            class="btn-login">

                        Cadastrar funcionário

                    </button>

                </div>

            </div>

        </form>


        <!-- VOLTAR -->

        <div class="voltar">

            Já possui cadastro?

            <a th:href="@{/funcionarios/login}">
                Entrar
            </a>

        </div>


    </section>

</main>


<!-- =========================================================
     RODAPÉ
========================================================= -->

<footer>

    <p>
        &copy; 2026 Cafeteria Segura.
        Todos os direitos reservados.
    </p>

</footer>


<!-- =========================================================
     MÁSCARAS
========================================================= -->

<script>

    // Máscara de CPF
    const cpf = document.getElementById("cpf");

    cpf.addEventListener("input", function () {

        let valor = cpf.value
            .replace(/\D/g, "")
            .slice(0, 11);

        valor = valor.replace(
            /(\d{3})(\d)/,
            "$1.$2"
        );

        valor = valor.replace(
            /(\d{3})(\d)/,
            "$1.$2"
        );

        valor = valor.replace(
            /(\d{3})(\d{1,2})$/,
            "$1-$2"
        );

        cpf.value = valor;

    });


    // Máscara de telefone
    const telefone =
        document.getElementById("telefone");

    telefone.addEventListener("input", function () {

        let valor = telefone.value
            .replace(/\D/g, "")
            .slice(0, 11);

        if (valor.length <= 10) {

            valor = valor.replace(
                /^(\d{2})(\d{4})(\d)/,
                "($1) $2-$3"
            );

        } else {

            valor = valor.replace(
                /^(\d{2})(\d{5})(\d)/,
                "($1) $2-$3"
            );

        }

        telefone.value = valor;

    });

</script>


</body>

</html>
