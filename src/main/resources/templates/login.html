<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Login da Cafeteria Segura">
    <meta name="author" content="Lucas Segura">

    <title>Login | Cafeteria Segura</title>

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body>

<header class="site-header">
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">

            <!-- Logo / Home -->
            <a class="navbar-brand" th:href="@{/}">
                <span class="navbar-brand-mark">☕</span>
                Cafeteria Segura
            </a>

            <div class="collapse navbar-collapse" id="menuPrincipal">

                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 gap-lg-2">

                    <!-- Home -->
                    <li class="nav-item">
                        <a class="nav-link"
                           th:href="@{/}">
                            Home
                        </a>
                    </li>

                    <!-- Produtos -->
                    <li class="nav-item">
                        <a class="nav-link"
                           th:href="@{/produtos}">
                            Produtos
                        </a>
                    </li>

                    <!-- Pedidos -->
                    <li class="nav-item">
                        <a class="nav-link"
                           th:href="@{/pedidos}">
                            Pedidos
                        </a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>
</header>


<main class="login-container">

    <section class="login-card">

        <h1>Entrar</h1>

        <p class="login-subtitulo">
            Acesse sua conta para realizar seus pedidos.
        </p>


        <!-- Mensagem de erro -->
        <div
            class="mensagem-erro"
            th:if="${erro}"
            th:text="${erro}">
            E-mail ou senha inválidos.
        </div>


        <!-- Formulário de login -->
        <form
            th:action="@{/login}"
            method="post">

            <div class="campo-login">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    autocomplete="email"
                    required>

            </div>


            <div class="campo-login">

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    autocomplete="current-password"
                    required>

            </div>


            <button
                type="submit"
                class="btn-login">
                Entrar
            </button>

        </form>


        <!-- Cadastro -->
        <div class="cadastro-link">

            <p>
                Ainda não possui uma conta?
            </p>

            <a th:href="@{/cadastro}">
                Criar minha conta
            </a>

        </div>

    </section>

</main>


<footer>
    <p>
        &copy; 2026 Cafeteria Segura. Todos os direitos reservados.
    </p>
</footer>

</body>
</html>
